<!DOCTYPE html>

<html lang="en" itemscope itemtype="http://schema.org/WebPage"> <!--Change the lang property to your web"s language-->

	<head prefix="og: http://ogp.me/ns#">

		<title>Monogatari Visual Novel</title> <!--Up to 60-70 Characters. Optimal Format: Primary Keyword - Secondary Keyword | Brand Name-->

		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cloud.umami.is">
		<link rel="shortcut icon" href="../assets/icons/icon.svg" />

		<link rel="manifest" href="/manifest.json">

		<!-- Third Party CSS Libraries -->

		<!-- Monogatari CSS Libraries -->
		<link rel="stylesheet" href="./engine/core/monogatari.css">

		<!-- Third Party JavaScript Libraries -->
		<!-- Umami Analytics -->
		<script defer src="https://cloud.umami.is/script.js" data-website-id="d358dae2-966c-46d3-bf10-c43ae1e20415"></script>

		<!-- Monogatari JavaScript Libraries -->
		<script src="./engine/core/monogatari.js"></script>
		<script src="./js/options.js"></script>
		<script src="./js/storage.js"></script>
		<script src="./js/analytics.js"></script>
		<script src="./js/quiz-analytics.js"></script>
		
		<!-- Story loader - must load BEFORE main.js -->
		<script src="./js/story-loader.js"></script>
		
		<!-- Main initialization - waits for story to load -->
		<script src="./js/main.js"></script>

	</head>

	<body>

		<script>
		// Handle story parameter from Senara
		const params = new URLSearchParams(window.location.search);
		const storyId = params.get('story');
		
		// If no story parameter, redirect to Senara after a small delay
		// to allow Netlify routing to complete
		if (!storyId) {
			setTimeout(() => {
				window.location.href = '../index.html';
			}, 100);
		} else {
			console.log(`✓ Loading story: ${storyId}`);
		}
	</script>

		<!-- Fallback when JavaScript is not available -->
		<noscript>
			<div class="middle text--center">
				<h2>JavaScript Disabled or not Supported.</h2>
				<small>To play this game, please enable JavaScript executing or use a different browser.</small>
			</div>
		</noscript>

		<div id="monogatari">
			<visual-novel>
				<language-selection-screen></language-selection-screen>
				<loading-screen></loading-screen>
				<main-screen>
					<main-menu></main-menu>
				</main-screen>
				<game-screen>
					<dialog-log></dialog-log>
					<text-box></text-box>
					<quick-menu></quick-menu>
				</game-screen>
				<gallery-screen></gallery-screen>
				<credits-screen></credits-screen>
				<load-screen></load-screen>
				<save-screen></save-screen>
				<settings-screen></settings-screen>
				<help-screen></help-screen>
			</visual-novel>
		</div>
	</body>

</html>
