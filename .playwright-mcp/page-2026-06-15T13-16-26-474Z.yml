            - text: Bukan ceramah, bukan modul, tapi pengalaman yang bisa dirasakan.
          - paragraph [ref=e70]: Cerita pertama kami dibuat sebagai eksperimen kecil. Ternyata, orang-orang merespons dengan cara yang tidak kami duga. Mereka berdiskusi, berbagi, dan bilang "ini relate banget."
