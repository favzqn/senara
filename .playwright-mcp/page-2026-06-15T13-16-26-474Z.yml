          - paragraph [ref=e66]: Senara dimulai dari sebuah frustrasi.
          - paragraph [ref=e67]: "Kami sering menemukan materi yang isinya bagus, tapi penyampaiannya membuat orang kehilangan minat sebelum selesai membaca. Di sisi lain, orang rela menghabiskan waktu berjam-jam untuk cerita: novel, webtoon, drama."
