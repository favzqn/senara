      - paragraph [ref=e60]: Umum
      - generic [ref=e61]:
        - button "Apa itu Senara?" [ref=e62] [cursor=pointer]:
          - heading "Apa itu Senara?" [level=3] [ref=e63]
          - img [ref=e64]
        - paragraph [ref=e67]: Senara adalah platform cerita interaktif berbasis visual novel. Kamu bisa membaca cerita, membuat pilihan, dan setiap keputusan membentuk jalan ceritamu sendiri. Topik cerita kami mencakup kesehatan mental, literasi keuangan, dan berbagai life skills lainnya.
      - generic [ref=e68]:
        - button "Untuk siapa platform ini dibuat?" [ref=e69] [cursor=pointer]:
          - heading "Untuk siapa platform ini dibuat?" [level=3] [ref=e70]
          - img [ref=e71]
        - paragraph [ref=e74]: Senara dibuat untuk siapa saja yang ingin belajar lewat cerita. Kami punya cerita untuk remaja (13+), dewasa muda, hingga umum. Guru dan fasilitator juga bisa menggunakan Senara sebagai bahan diskusi di kelas atau workshop.
      - generic [ref=e75]:
        - button "Apakah Senara benar-benar gratis?" [ref=e76] [cursor=pointer]:
          - heading "Apakah Senara benar-benar gratis?" [level=3] [ref=e77]
          - img [ref=e78]
        - paragraph [ref=e81]: Ya, 100% gratis. Bukan freemium, bukan trial. Semua cerita bisa diakses tanpa bayar, sekarang dan selamanya. Senara adalah platform nonprofit yang dibangun oleh komunitas relawan.
      - generic [ref=e82]:
        - button "Apakah saya perlu membuat akun?" [ref=e83] [cursor=pointer]:
          - heading "Apakah saya perlu membuat akun?" [level=3] [ref=e84]
          - img [ref=e85]
        - paragraph [ref=e88]: Tidak perlu. Kamu bisa langsung membaca cerita tanpa login atau registrasi. Progress ceritamu tersimpan otomatis di browser. Fitur akun mungkin akan hadir di masa depan untuk sinkronisasi antar perangkat.
      - paragraph [ref=e89]: Konten
      - generic [ref=e90]:
        - button "Apakah Senara bisa menggantikan psikolog atau konselor?" [ref=e91] [cursor=pointer]:
          - heading "Apakah Senara bisa menggantikan psikolog atau konselor?" [level=3] [ref=e92]
          - img [ref=e93]
        - paragraph [ref=e96]: Tidak. Senara bukan pengganti layanan kesehatan mental profesional. Cerita kami bertujuan untuk meningkatkan literasi dan kesadaran, bukan untuk mendiagnosis atau mengobati. Jika kamu membutuhkan bantuan profesional, silakan hubungi psikolog atau konselor terdekat.
      - generic [ref=e97]:
        - button "Siapa yang membuat cerita di Senara?" [ref=e98] [cursor=pointer]:
          - heading "Siapa yang membuat cerita di Senara?" [level=3] [ref=e99]
          - img [ref=e100]
        - paragraph [ref=e103]: "Cerita dibuat oleh tim relawan dari berbagai latar belakang: penulis, desainer, developer, dan ahli di bidang terkait. Setiap cerita melalui proses review untuk memastikan akurasi dan kualitas konten."
      - generic [ref=e104]:
        - button "Apakah konten Senara aman untuk remaja?" [ref=e105] [cursor=pointer]:
          - heading "Apakah konten Senara aman untuk remaja?" [level=3] [ref=e106]
          - img [ref=e107]
        - paragraph [ref=e110]: Ya. Setiap cerita memiliki label usia yang jelas (misalnya 13+). Kami menghindari konten eksplisit dan selalu memberikan peringatan jika ada topik sensitif. Orang tua dan guru bisa melihat deskripsi cerita sebelum merekomendasikan ke anak atau siswa.
      - paragraph [ref=e111]: Penggunaan
      - generic [ref=e112]:
        - button "Bagaimana guru bisa menggunakan Senara?" [ref=e113] [cursor=pointer]:
          - heading "Bagaimana guru bisa menggunakan Senara?" [level=3] [ref=e114]
          - img [ref=e115]
        - paragraph [ref=e118]: Guru bisa menggunakan cerita Senara sebagai bahan diskusi di kelas, tugas refleksi, atau ice breaker di awal sesi. Cukup pilih cerita yang sesuai dengan topik, lalu ajak siswa membaca bersama atau mandiri. Setelah selesai, diskusikan pilihan dan pelajaran dari cerita tersebut.
      - generic [ref=e119]:
        - button "Bisa diakses di HP atau hanya di komputer?" [ref=e120] [cursor=pointer]:
          - heading "Bisa diakses di HP atau hanya di komputer?" [level=3] [ref=e121]
          - img [ref=e122]
        - paragraph [ref=e125]: "Senara bisa diakses di semua perangkat: HP, tablet, atau komputer. Cukup buka browser dan kunjungi website kami. Tidak perlu download aplikasi."
      - paragraph [ref=e126]: Privasi & Dukungan
      - generic [ref=e127]:
        - button "Bagaimana privasi saya dilindungi?" [ref=e128] [cursor=pointer]:
          - heading "Bagaimana privasi saya dilindungi?" [level=3] [ref=e129]
          - img [ref=e130]
        - paragraph [ref=e133]: Kami tidak mengumpulkan data pribadi. Tidak ada login, tidak ada tracking individual. Kami hanya menggunakan analytics anonim untuk memahami cerita mana yang paling diminati. Progress ceritamu tersimpan lokal di browsermu sendiri.
      - generic [ref=e134]:
        - button "Bagaimana cara mendukung Senara?" [ref=e135] [cursor=pointer]:
          - heading "Bagaimana cara mendukung Senara?" [level=3] [ref=e136]
          - img [ref=e137]
        - paragraph [ref=e140]:
          - text: "Ada beberapa cara: (1) Bagikan Senara ke teman atau komunitas, (2) Donasi via"
          - link "Trakteer" [ref=e141] [cursor=pointer]:
