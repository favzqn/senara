            - text: Tentang Cerita Ini
          - paragraph [ref=e117]: Kesehatan mental bukan kelemahan. Itu adalah kekuatan. Ikuti perjalanan Vani melalui tantangan emosional, dari kecemasan hingga depresi, sambil belajar mengenali tanda-tanda gangguan mental dan memahami kapan harus mencari bantuan. Melalui 5 bab yang mendalam, kamu akan mengungkap mitos seputar kesehatan mental, mengurangi stigma, dan menguasai teknik relaksasi yang bisa langsung dipraktikkan. Jadilah Pahlawan Kesehatan Mental, bukan hanya untuk dirimu sendiri, tapi untuk orang-orang yang kamu sayangi.
