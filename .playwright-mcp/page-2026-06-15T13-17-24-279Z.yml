          - paragraph [ref=e96]: "Kami tidak punya investor yang menuntut profit. Tidak ada target revenue yang harus dicapai. Ini membebaskan kami untuk fokus pada satu hal: membuat cerita yang benar-benar bermanfaat."
          - paragraph [ref=e97]: Model nonprofit juga berarti kami tidak perlu menjual data pengguna atau memasang iklan yang mengganggu. Pengalaman membaca tetap bersih dan fokus.
